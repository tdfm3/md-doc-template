name: docs

on:
  # main ブランチへの push でデプロイする
  push:
    branches:
      - main
  # 手動実行も可能にする
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # GitHub Pages デプロイに必要な権限を設定
    permissions:
      contents: read
      pages: write
      id-token: write

    # 公開先の環境（Actions の実行結果に公開 URL が表示される）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # 同時実行制御（pages-build-deployment との競合を避ける）
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 各ページの最終更新日時を git log から取得するため全履歴を取得する
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # package-lock.json をキーに ~/.npm をキャッシュする。
          # setup-node の自動キャッシュは package.json に packageManager
          # フィールドがある場合のみ有効になるため、明示的に指定する。
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages のプロジェクトサイトは
          # https://<組織名>.github.io/<リポジトリ名>/ で配信されるため、
          # リポジトリ名をサブパス（base）として渡す。
          #
          # 独自ドメイン、または https://<組織名>.github.io/ の直下で公開する場合は、
          # 次の1行を削除すること（base は '/' になる）。
          VUEPRESS_BASE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/.vuepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
